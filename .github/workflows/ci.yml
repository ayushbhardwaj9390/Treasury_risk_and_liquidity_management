name: treasury-ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -r backend/requirements-lock.txt
      - run: cd backend && PYTHONPATH=. pytest -q
      - run: cd backend && python -m compileall -q app
      - run: cd backend && DATABASE_URL=sqlite:///./migration-ci.db python -m alembic upgrade head
      - run: cd backend && DATABASE_URL=sqlite:///./migration-ci.db python -m alembic check
      - run: pip install pip-audit && pip-audit -r backend/requirements-lock.txt --no-deps --disable-pip
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: pnpm/action-setup@v4
        with: {version: "11.19.0"}
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && pnpm exec tsc --noEmit
      - run: cd frontend && pnpm test
      - run: cd frontend && pnpm build
      - run: cd frontend && pnpm audit --audit-level=high
